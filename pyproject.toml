[project]
name = "clipforge"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27",
  "websockets>=13",
  "numpy>=1.26",
  "pyyaml>=6",
  "streamlink>=7",
  "yt-dlp",
  "faster-whisper>=1.1",
  "opencv-python>=4.10",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "psutil>=6",
  "nvidia-ml-py>=12",
  "nvidia-cublas-cu12==12.8.4.1",
  "nvidia-cudnn-cu12==9.10.2.21",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false
