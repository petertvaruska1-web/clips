# "Grand Theft Auto VI" category; weight multiplies their priority and score boost.
streamers:
  kaicenat: 1.5
  caseoh_: 1.5
  xqc: 1.5
  theburntpeanut: 1.5
  stableronaldo: 1.5
  zackrawrr: 1.5
  jynxzi: 1.5
  hasanabi: 1.2
  jasontheween: 1.2
  lacy: 1.2
  plaqueboymax: 1.2
  yourragegaming: 1.2
  brucedropemoff: 1.2
  rdcgaming: 1.2
